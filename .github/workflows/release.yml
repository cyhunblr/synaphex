name: npm production release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      name: ${{ steps.identity.outputs.name }}
      version: ${{ steps.identity.outputs.version }}
      artifact_filename: ${{ steps.identity.outputs.artifact_filename }}
      size: ${{ steps.identity.outputs.size }}
      sha256: ${{ steps.identity.outputs.sha256 }}
      sha512: ${{ steps.identity.outputs.sha512 }}
      integrity: ${{ steps.identity.outputs.integrity }}
      shasum: ${{ steps.identity.outputs.shasum }}
      upload_name: ${{ steps.upload-name.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require main
        run: |
          node scripts/release/workflow-release.mjs assert-branch \
            --actual "$GITHUB_REF_NAME" \
            --expected main \
            --ref-type "$GITHUB_REF_TYPE"

      - name: Install dependencies
        run: npm ci

      - name: Verify pristine checkout and stable package identity
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          test "$NAME" = synaphex
          node scripts/release/workflow-release.mjs assert-stable --version "$VERSION"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: MCP stdio protocol tests
        run: npm run test:mcp-stdio

      - name: Whitespace check
        run: git diff --check

      - name: Package dry run
        run: npm pack --dry-run

      - name: Prepare and validate exact artifact
        run: npm run release:prepare

      - name: Record artifact identity
        id: identity
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          ARTIFACT=$(node scripts/release/workflow-release.mjs artifact-path \
            --directory release-candidate \
            --name "$NAME" \
            --version "$VERSION")
          node scripts/release/workflow-release.mjs artifact-identity \
            --path "$ARTIFACT" \
            --name "$NAME" \
            --version "$VERSION" \
            --git-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Confirm coordinate is unused
        run: |
          node scripts/release/registry-state.mjs \
            --name "${{ steps.identity.outputs.name }}" \
            --version "${{ steps.identity.outputs.version }}" \
            --tarball "${{ steps.identity.outputs.artifact_path }}"

      - name: Name uploaded artifact
        id: upload-name
        run: echo "value=npm-release-${{ steps.identity.outputs.version }}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload exact release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.upload-name.outputs.value }}
          path: ${{ steps.identity.outputs.artifact_path }}
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish npm latest
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Require main
        run: |
          node scripts/release/workflow-release.mjs assert-branch \
            --actual "$GITHUB_REF_NAME" \
            --expected main \
            --ref-type "$GITHUB_REF_TYPE"

      - name: Download exact release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.upload_name }}
          path: release-candidate

      - name: Resolve exact local artifact path
        id: artifact-path
        env:
          ARTIFACT_FILENAME: ${{ needs.prepare.outputs.artifact_filename }}
        run: |
          ARTIFACT_PATH=$(node scripts/release/workflow-release.mjs local-artifact-path \
            --workspace "$GITHUB_WORKSPACE" \
            --filename "$ARTIFACT_FILENAME")
          echo "path=$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify downloaded artifact identity
        env:
          ARTIFACT: ${{ steps.artifact-path.outputs.path }}
        run: |
          node scripts/release/workflow-release.mjs verify-artifact \
            --path "$ARTIFACT" \
            --size "${{ needs.prepare.outputs.size }}" \
            --sha256 "${{ needs.prepare.outputs.sha256 }}" \
            --sha512 "${{ needs.prepare.outputs.sha512 }}" \
            --integrity "${{ needs.prepare.outputs.integrity }}" \
            --shasum "${{ needs.prepare.outputs.shasum }}"

      - name: Verify npm identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org/

      - name: Re-check coordinate is unused
        env:
          ARTIFACT: ${{ steps.artifact-path.outputs.path }}
        run: |
          node scripts/release/registry-state.mjs \
            --name "${{ needs.prepare.outputs.name }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --tarball "$ARTIFACT"

      - name: Publish exact artifact to latest
        env:
          ARTIFACT: ${{ steps.artifact-path.outputs.path }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$ARTIFACT" --access public --tag latest

      - name: Verify artifact remained byte-identical
        env:
          ARTIFACT: ${{ steps.artifact-path.outputs.path }}
        run: |
          node scripts/release/workflow-release.mjs verify-artifact \
            --path "$ARTIFACT" \
            --size "${{ needs.prepare.outputs.size }}" \
            --sha256 "${{ needs.prepare.outputs.sha256 }}" \
            --sha512 "${{ needs.prepare.outputs.sha512 }}" \
            --integrity "${{ needs.prepare.outputs.integrity }}" \
            --shasum "${{ needs.prepare.outputs.shasum }}"
