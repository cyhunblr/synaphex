name: npm test channel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare test prerelease artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      name: ${{ steps.identity.outputs.name }}
      version: ${{ steps.identity.outputs.version }}
      artifact_filename: ${{ steps.identity.outputs.artifact_filename }}
      size: ${{ steps.identity.outputs.size }}
      sha256: ${{ steps.identity.outputs.sha256 }}
      sha512: ${{ steps.identity.outputs.sha512 }}
      integrity: ${{ steps.identity.outputs.integrity }}
      shasum: ${{ steps.identity.outputs.shasum }}
      upload_name: ${{ steps.upload-name.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require test
        run: |
          node scripts/release/workflow-release.mjs assert-branch \
            --actual "$GITHUB_REF_NAME" \
            --expected test \
            --ref-type "$GITHUB_REF_TYPE"

      - name: Verify pristine source metadata
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          NAME=$(node -p "require('./package.json').name")
          STABLE_VERSION=$(node -p "require('./package.json').version")
          test "$NAME" = synaphex
          node scripts/release/workflow-release.mjs assert-stable --version "$STABLE_VERSION"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: MCP stdio protocol tests
        run: npm run test:mcp-stdio

      - name: Whitespace check
        run: git diff --check

      - name: Package dry run
        run: npm pack --dry-run

      - name: Derive ephemeral test prerelease
        id: prerelease
        run: |
          set -euo pipefail
          STABLE_VERSION=$(node -p "require('./package.json').version")
          VERSION=$(node scripts/release/workflow-release.mjs derive-test-version \
            --stable "$STABLE_VERSION" \
            --run-number "$GITHUB_RUN_NUMBER")
          npm version "$VERSION" --no-git-tag-version --ignore-scripts
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          node scripts/release/workflow-release.mjs assert-test-version --version "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify only package metadata changed
        run: |
          set -euo pipefail
          test -z "$(git diff --cached --name-only)"
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "package-lock.json package.json "

      - name: Prepare and validate exact test artifact
        run: npm run release:prepare -- --channel test

      - name: Record artifact identity
        id: identity
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          test "$NAME" = synaphex
          test "$VERSION" = "${{ steps.prerelease.outputs.version }}"
          ARTIFACT=$(node scripts/release/workflow-release.mjs artifact-path \
            --directory release-candidate \
            --name "$NAME" \
            --version "$VERSION")
          node scripts/release/workflow-release.mjs assert-tarball-package \
            --path "$ARTIFACT" \
            --name "$NAME" \
            --version "$VERSION"
          node scripts/release/workflow-release.mjs artifact-identity \
            --path "$ARTIFACT" \
            --name "$NAME" \
            --version "$VERSION" \
            --git-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Confirm prerelease coordinate is unused
        run: |
          node scripts/release/registry-state.mjs \
            --name "${{ steps.identity.outputs.name }}" \
            --version "${{ steps.identity.outputs.version }}" \
            --tarball "${{ steps.identity.outputs.artifact_path }}"

      - name: Name uploaded artifact
        id: upload-name
        run: echo "value=npm-test-${{ steps.identity.outputs.version }}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload exact test artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.upload-name.outputs.value }}
          path: ${{ steps.identity.outputs.artifact_path }}
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish npm test
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          package-manager-cache: false

      - name: Select Trusted Publishing npm CLI
        run: npm install --global npm@11.5.1

      - name: Verify Trusted Publishing runtime
        run: |
          set -euo pipefail
          NODE_VERSION=$(node --version)
          NPM_VERSION=$(npm --version)
          echo "Node: $NODE_VERSION"
          echo "npm: $NPM_VERSION"
          test "$NODE_VERSION" = "v22.23.2"
          test "$NPM_VERSION" = "11.5.1"

      - name: Require test
        run: |
          node scripts/release/workflow-release.mjs assert-branch \
            --actual "$GITHUB_REF_NAME" \
            --expected test \
            --ref-type "$GITHUB_REF_TYPE"

      - name: Download exact test artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.upload_name }}
          path: release-candidate

      - name: Resolve exact local artifact path
        id: artifact-path
        env:
          ARTIFACT_FILENAME: ${{ needs.prepare.outputs.artifact_filename }}
        run: |
          ARTIFACT_PATH=$(node scripts/release/workflow-release.mjs local-artifact-path \
            --workspace "$GITHUB_WORKSPACE" \
            --filename "$ARTIFACT_FILENAME")
          echo "path=$ARTIFACT_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify downloaded artifact identity
        env:
          ARTIFACT: ${{ steps.artifact-path.outputs.path }}
        run: |
          node scripts/release/workflow-release.mjs verify-artifact \
            --path "$ARTIFACT" \
            --size "${{ needs.prepare.outputs.size }}" \
            --sha256 "${{ needs.prepare.outputs.sha256 }}" \
            --sha512 "${{ needs.prepare.outputs.sha512 }}" \
            --integrity "${{ needs.prepare.outputs.integrity }}" \
            --shasum "${{ needs.prepare.outputs.shasum }}"

      - name: Re-check prerelease coordinate is unused
        env:
          ARTIFACT: ${{ steps.artifact-path.outputs.path }}
        run: |
          node scripts/release/registry-state.mjs \
            --name "${{ needs.prepare.outputs.name }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --tarball "$ARTIFACT"

      - name: Publish exact artifact to test
        env:
          ARTIFACT: ${{ steps.artifact-path.outputs.path }}
        run: npm publish "$ARTIFACT" --access public --tag test
